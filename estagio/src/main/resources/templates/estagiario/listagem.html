<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Estagiários</title>
    <script th:src="@{/js/tailwind.js}"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen">
    <div class="max-w-7xl mx-auto px-6 py-10">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Estagiários cadastrados</h1>
                <p class="text-sm text-gray-500 mt-1">Visualize, filtre, edite ou remova os estudantes cadastrados.</p>
            </div>
            <div class="flex items-center gap-4">
                <a th:href="@{/}" class="text-sm font-medium text-gray-600 hover:text-gray-900 transition">Início</a>
                <a th:href="@{/empresa/listar}" class="text-sm font-medium text-gray-600 hover:text-gray-900 transition">Ver empresas</a>
                <a th:href="@{/estagiario/cadastrar}" class="inline-flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-sm transition">
                    + Novo estagiário
                </a>
            </div>
        </div>

        <div th:if="${sucesso}" class="mb-6 p-4 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-700 text-sm rounded-r shadow-sm">
            <p th:text="${sucesso}"></p>
        </div>
        <div th:if="${erro}" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded-r shadow-sm">
            <p th:text="${erro}"></p>
        </div>

        <!-- Filtros -->
        <div class="bg-white p-5 rounded-xl shadow-sm ring-1 ring-gray-900/5 mb-6">
            <form th:action="@{/estagiario/listar}" method="get" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">RA:</label>
                    <input type="text" name="ra" th:value="${paramRa}" placeholder="Digite o RA..."
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome:</label>
                    <input type="text" name="nome" th:value="${paramNome}" placeholder="Nome do estagiário..."
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Curso:</label>
                    <input type="text" name="curso" th:value="${paramCurso}" placeholder="Curso..."
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" />
                </div>
                <div class="flex items-center space-x-3">
                    <button type="submit" class="bg-gray-900 hover:bg-gray-800 text-white text-sm font-medium px-4 py-2 rounded-lg transition">Filtrar</button>
                    <a th:href="@{/estagiario/listar}" class="text-sm text-gray-500 hover:text-gray-800 transition">Limpar filtros</a>
                </div>
            </form>
        </div>

        <!-- Tabela -->
        <div class="bg-white shadow-sm ring-1 ring-gray-900/5 rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 bg-gray-50/50 text-xs font-semibold text-gray-500 tracking-wider">
                            <th class="py-3.5 px-6">ID</th>
                            <th class="py-3.5 px-6">Nome</th>
                            <th class="py-3.5 px-6">RA</th>
                            <th class="py-3.5 px-6">Curso</th>
                            <th class="py-3.5 px-6">Período</th>
                            <th class="py-3.5 px-6">E-mail</th>
                            <th class="py-3.5 px-6 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 text-sm">
                        <tr th:each="est : ${estagiarios}" class="hover:bg-gray-50/50 transition">
                            <td class="py-4 px-6 text-gray-500 font-mono text-xs" th:text="${est.id}">1</td>
                            <td class="py-4 px-6 font-medium text-gray-900" th:text="${est.nome}">Nome</td>
                            <td class="py-4 px-6 text-gray-600 font-mono text-xs" th:text="${est.ra}">RA</td>
                            <td class="py-4 px-6 text-gray-600" th:text="${est.curso}">Curso</td>
                            <td class="py-4 px-6 text-gray-600" th:text="${est.periodo}">1</td>
                            <td class="py-4 px-6 text-gray-600" th:text="${est.email}">E-mail</td>
                            <td class="py-4 px-6 text-right font-medium">
                                <a th:href="@{/estagiario/editar/{ra}(ra=${est.ra})}" class="text-indigo-600 hover:text-indigo-900 transition mr-3">Editar</a>
                                <form th:action="@{/estagiario/deletar/{id}(id=${est.id})}" method="post" class="inline"
                                      onsubmit="return confirm('Deseja realmente excluir?')">
                                    <button type="submit" class="text-red-600 hover:text-red-900 transition">Deletar</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(estagiarios)}">
                            <td colspan="7" class="py-8 text-center text-gray-400 text-sm">Nenhum estagiário encontrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
