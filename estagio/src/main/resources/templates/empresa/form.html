<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${empresaDTO.id != null} ? 'Editar Empresa' : 'Cadastrar Empresa'">Cadastrar Empresa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="max-w-3xl mx-auto px-6 py-10 w-full">
        <div class="mb-8">
            <h1 class="text-2xl font-semibold tracking-tight text-gray-900" th:text="${empresaDTO.id != null} ? 'Editar Empresa' : 'Cadastro de Empresa'">Cadastro de Empresa</h1>
            <p class="text-sm text-gray-500 mt-1">Preencha os dados da organização parceira para o sistema de estágio.</p>
        </div>

        <div th:if="${erroCnpj}" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded-r shadow-sm">
            <p th:text="${erroCnpj}"></p>
        </div>

        <form action="#" th:action="@{/empresa/cadastrar}" th:object="${empresaDTO}" method="post" class="bg-white shadow-sm ring-1 ring-gray-900/5 rounded-xl p-8 space-y-6">
            <input type="hidden" th:field="*{id}" />
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">CNPJ:</label>
                    <input type="text" th:field="*{cnpj}" th:readonly="${modoEdicao}" 
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition disabled:bg-gray-100 read-only:bg-gray-100 read-only:text-gray-500" 
                           required
                           minlength="14"
                           maxlength="14"
                           inputmode="numeric"
                           pattern="\d*"
                           title="Apenas números são permitidos" />
                    <span th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}" class="text-xs text-red-600 mt-1 block"></span>
                    <small th:if="${modoEdicao}" class="text-xs text-gray-400 mt-1 block">O CNPJ não pode ser alterado.</small>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome da Empresa:</label>
                    <input type="text" th:field="*{nomeEmpresa}" 
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" 
                           required />
                    <span th:if="${#fields.hasErrors('nomeEmpresa')}" th:errors="*{nomeEmpresa}" class="text-xs text-red-600 mt-1 block"></span>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Área de Atuação:</label>
                    <input type="text" th:field="*{areaAtuacao}" 
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cidade:</label>
                    <input type="text" th:field="*{cidade}" 
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">CEP:</label>
                    <input type="text" th:field="*{cep}" 
                           maxlength="8"
                           minlength="8"
                           inputmode="numeric"
                           pattern="\d*"
                           title="Apenas números são permitidos"
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail:</label>
                    <input type="email" th:field="*{email}" 
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Site:</label>
                    <input type="text" th:field="*{site}" 
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Telefone:</label>
                    <input type="text" th:field="*{telefone}" 
                           maxlength="11"
                           minlength="8" 
                           inputmode="numeric"
                           pattern="\d*"
                           title="Apenas números são permitidos"
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Contato:</label>
                    <input type="text" th:field="*{nomeContato}" 
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cargo do Contato:</label>
                    <input type="text" th:field="*{cargoContato}" 
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Área/Departamento:</label>
                    <input type="text" th:field="*{areaDepartamento}" 
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Linkedin:</label>
                    <input type="text" th:field="*{linkedin}" 
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" />
                </div>
            </div>
            <div class="flex items-center justify-end space-x-4 pt-4 border-t border-gray-100">
                <a th:href="@{/empresa/listar}" class="text-sm font-medium text-gray-600 hover:text-gray-900 transition">Voltar para a Listagem</a>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg shadow-sm transition">Salvar</button>
            </div>
        </form>
    </div>
</body>
</html>
