<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Empresas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen">

    <div class="max-w-7xl mx-auto px-6 py-10">
        
        <!-- Cabeçalho e Botão Novo -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Empresas Cadastradas</h1>
                <p class="text-sm text-gray-500 mt-1">Visualize, filtre, edite ou remova as empresas cadastradas.</p>
            </div>
                        <div class="flex items-center gap-4">
                <a th:href="@{/}" class="text-sm font-medium text-gray-600 hover:text-gray-900 transition">Início</a>
                <a th:href="@{/estagiario/listar}" class="text-sm font-medium text-gray-600 hover:text-gray-900 transition">Ver estagiários</a>
                <a th:href="@{/empresa/cadastrar}" class="inline-flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-sm transition">
                    + Nova Empresa
                </a>
            </div>
        </div>

        <div th:if="${sucesso}" class="mb-6 p-4 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-700 text-sm rounded-r shadow-sm">
            <p th:text="${sucesso}"></p>
        </div>
        <div th:if="${erro}" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded-r shadow-sm">
            <p th:text="${erro}"></p>
        </div>
        
        <!-- Formulário de Filtro -->
        <div class="bg-white p-5 rounded-xl shadow-sm ring-1 ring-gray-900/5 mb-6">
            <form th:action="@{/empresa/listar}" method="get" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="block text-xs font-medium text-gray-600 uppercase mb-1">Pesquisar por CNPJ:</label>
                    <input type="text" name="cnpj" th:value="${paramCnpj}" placeholder="Digite o CNPJ..." 
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" />
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 uppercase mb-1">Pesquisar por Nome:</label>
                    <input type="text" name="nome" th:value="${paramNome}" placeholder="Nome da empresa..." 
                           class="w-full rounded-lg border border-gray-300 px-3.5 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" />
                </div>
                <div class="flex items-center space-x-3">
                    <button type="submit" class="bg-gray-900 hover:bg-gray-800 text-white text-sm font-medium px-4 py-2 rounded-lg transition">Filtrar</button>
                    <a th:href="@{/empresa/listar}" class="text-sm text-gray-500 hover:text-gray-800 transition">Limpar Filtros</a>
                </div>
            </form>
        </div>

        <!-- Tabela -->
        <div class="bg-white shadow-sm ring-1 ring-gray-900/5 rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 bg-gray-50/50 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            <th class="py-3.5 px-6">ID</th>
                            <th class="py-3.5 px-6">Nome</th>
                            <th class="py-3.5 px-6">CNPJ</th>
                            <th class="py-3.5 px-6">Cidade</th>
                            <th class="py-3.5 px-6">E-mail</th>
                            <th class="py-3.5 px-6 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 text-sm">
                        <tr th:each="emp : ${empresas}" class="hover:bg-gray-50/50 transition">
                            <td class="py-4 px-6 text-gray-500 font-mono text-xs" th:text="${emp.id}">1</td>
                            <td class="py-4 px-6 font-medium text-gray-900" th:text="${emp.nomeEmpresa}">Nome</td>
                            <td class="py-4 px-6 text-gray-600 font-mono text-xs" th:text="${emp.cnpj}">CNPJ</td>
                            <td class="py-4 px-6 text-gray-600" th:text="${emp.cidade}">Cidade</td>
                            <td class="py-4 px-6 text-gray-600" th:text="${emp.email}">Email</td>
                            <td class="py-4 px-6 text-right space-x-3 font-medium">
                                <a th:href="@{/empresa/editar/{cnpj}(cnpj=${emp.cnpj})}" class="text-indigo-600 hover:text-indigo-900 transition">Editar</a>
                                <a th:href="@{/empresa/deletar/{id}(id=${emp.id})}" onclick="return confirm('Deseja realmente excluir?')" class="text-red-600 hover:text-red-900 transition">Deletar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(empresas)}">
                            <td colspan="6" class="py-8 text-center text-gray-400 text-sm">Nenhuma empresa encontrada.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
